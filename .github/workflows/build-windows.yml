name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      # Interface, CLI, executaveis portateis, instalador e checksums (mesmo script usado localmente)
      - name: Build
        shell: cmd
        run: packaging\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Dupin-Scan-Windows
          path: |
            Output/*.exe
            Output/SHA256SUMS.txt
