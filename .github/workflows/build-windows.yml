name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 psutil pyinstaller pillow
          python -m pip install yara-python || echo sem yara
      - name: Icones
        run: python packaging/make_icon.py
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean --windowed --name Vigil --icon assets/vigil.ico --add-data "assets;assets" run_vigil.py
      - name: Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\vigil.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Vigil-Windows
          path: |
            Output/Vigil-Setup-*.exe
            dist/Vigil
